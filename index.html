<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Pattern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout idea: one centered cue panel (like the desktop overlay), with a full-screen template editor on top. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --line:#d5d8de; --text:#1d2330; --mute:#6a7282;
  --btn:#e8eaee; --btn-off:#f1f2f5; --btn-off-text:#a3a9b5;
  --accent:#0e639c; --accent-text:#fff; --ok:#2e7d32; --ok-soft:#d7ecd9; --cur:#0a6fb3; --done:#8b92a0;
  --danger:#b3261e;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --panel:#1e1e1e; --line:#3a3a3a; --text:#d6d6d6; --mute:#8a8a8a;
    --btn:#333333; --btn-off:#262626; --btn-off-text:#5a5a5a;
    --accent:#0e639c; --ok:#2e7d32; --ok-soft:#1b5e20; --cur:#4fc3f7; --done:#777; --danger:#ef7a73;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --panel:#1e1e1e; --line:#3a3a3a; --text:#d6d6d6; --mute:#8a8a8a;
  --btn:#333333; --btn-off:#262626; --btn-off-text:#5a5a5a;
  --accent:#0e639c; --ok:#2e7d32; --ok-soft:#1b5e20; --cur:#4fc3f7; --done:#777; --danger:#ef7a73;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 var(--font);padding:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cur);outline-offset:2px}
.app{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:6px}
.top h1{font-size:15px;font-weight:600;margin:0;flex:1;letter-spacing:.2px}
.chip{background:var(--btn);border:0;border-radius:4px;padding:5px 9px;font-size:12px;font-weight:500;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--ok);color:#fff}
.sub{color:var(--mute);font-size:12px;margin:0}
.row{display:grid;gap:6px}
.mods{grid-template-columns:repeat(5,1fr)}
.cats{grid-template-columns:repeat(4,1fr)}
.studies{grid-template-columns:repeat(2,1fr)}
.btn{background:var(--btn);border:0;border-radius:4px;padding:8px 6px;text-align:center;color:var(--text);font-size:13px;min-width:0;overflow-wrap:anywhere}
.mods .btn{font-weight:600;font-size:14px}
.btn.sel{background:var(--accent);color:#fff;font-weight:600}
.btn.study-sel{background:var(--ok);color:#fff;font-weight:600}
.btn.off{background:var(--btn-off);color:var(--btn-off-text)}
.btn.reviewed{background:var(--ok-soft);color:var(--text)}
.studies .btn{font-size:12.5px}
.seqs{display:grid;gap:4px}
.wrap{display:contents}
[hidden]{display:none!important}
.vs{font-size:13px;max-width:460px}
.vsb{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center}
.vsb label{color:var(--mute);font-size:12px}
.vsb select{min-width:0;width:100%}
.vsb button{grid-column:2;justify-self:start}
.app.pip .editbtn{display:none}
.app.pip{max-width:none;border:0;border-radius:0;min-height:100vh}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.match{display:flex;gap:6px}
.match input{flex:1;min-width:0;background:var(--btn-off);border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-size:13px}
.match button{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:7px 12px;font-size:13px;font-weight:500}
.list{list-style:none;margin:0;padding:0;max-height:340px;min-height:140px;overflow-y:auto;position:relative}
.list li{padding:5px 8px;border-radius:4px;cursor:pointer;color:var(--text);display:flex;gap:8px}
.list li:hover{background:var(--btn-off)}
.list li .mk{width:1.1em;flex:none;color:var(--mute);font-family:var(--mono);font-size:13px}
.list li.done{color:var(--done)}
.list li.cur{color:var(--cur);font-weight:600}
.list li.cur .mk{color:var(--cur)}
.list li.finish{color:var(--ok);font-weight:600;cursor:default}
.list .empty{color:var(--mute);padding:10px 8px;cursor:default}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:6px}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.big{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:12px;font-size:15px;font-weight:600}
.big.alt{background:var(--btn);color:var(--text);font-weight:500}
.nav2 .btn{font-size:12px;color:var(--mute)}
.mini{display:none;flex-direction:column;gap:2px;padding:4px 2px}
.mini .ms{color:var(--mute);font-size:12px}
.mini .mv{color:var(--ok);font-size:17px;font-weight:600}
.mini .mi{color:var(--cur);font-size:24px;font-weight:600;line-height:1.25}
.app.min .chrome{display:none}
.app.min .mini{display:flex}
.foot{color:var(--mute);font-size:11.5px;margin:0}
kbd{font-family:var(--mono);font-size:11px;background:var(--btn);border-radius:3px;padding:1px 5px}
/* editor */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:stretch;justify-content:center;z-index:20;padding:12px}
.ovl.open{display:flex}
.ed{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%;max-width:980px;display:flex;flex-direction:column;overflow:hidden}
.ed header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed header h2{margin:0;font-size:15px;font-weight:600;flex:1;min-width:120px}
.tabs{display:flex;gap:4px}
.tabs button{background:var(--btn);border:0;border-radius:4px;padding:5px 11px;font-weight:600;font-size:13px}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.edbody{flex:1;min-height:0;display:grid;grid-template-columns:260px 1fr}
.tplwrap{flex:1;min-height:0;display:flex;flex-direction:column}
#evoice{flex:1}
.subnav{padding:8px 14px;border-bottom:1px solid var(--line)}
.tpltools{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tpltools .sp{flex:1}
.grp{display:flex;gap:4px;flex-wrap:wrap}
.pane{overflow-y:auto;padding:12px 14px;min-height:0}
.pane.left{border-right:1px solid var(--line)}
.cat-h{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin:12px 0 4px}
.cat-h:first-of-type{margin-top:0}
.st{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:4px;padding:5px 8px;font-size:13.5px}
.st:hover{background:var(--btn-off)}
.st[aria-current="true"]{background:var(--accent);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tools button,.sm{background:var(--btn);border:0;border-radius:4px;padding:5px 9px;font-size:12px;font-weight:500}
.sm.danger{color:var(--danger)}
.sm:disabled{opacity:.4;cursor:default}
.meta{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.meta h3{margin:0;font-size:15px;flex:1;min-width:140px}
select,.field{background:var(--btn-off);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:13px}
.rows{display:flex;flex-direction:column;gap:3px}
.er{display:flex;gap:4px;align-items:center}
.er.drop{box-shadow:0 -2px 0 var(--cur)}
.er .h{cursor:grab;color:var(--mute);padding:2px 5px;user-select:none;font-size:15px}
.er input{flex:1;min-width:0;background:var(--btn-off);border:1px solid transparent;border-radius:4px;padding:4px 7px;font-size:13.5px}
.er input:focus{border-color:var(--line)}
.er.hdr input{color:var(--cur);font-weight:600}
.er .sm{padding:3px 7px}
.kw{margin-top:14px;display:flex;flex-direction:column;gap:4px}
.kw label{font-size:12px;color:var(--mute)}
.kw input{background:var(--btn-off);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:13px;font-family:var(--mono)}
.ed footer{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.ed footer .sp{flex:1}
.pri{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:7px 16px;font-weight:600;font-size:13px}
.msg{color:var(--ok);font-size:12px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.dlg.open{display:flex}
.dlg .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
.dlg h4{margin:0;font-size:15px}
.dlg p{margin:0;color:var(--mute);font-size:13px}
.dlg textarea{min-height:200px;font-family:var(--mono);font-size:11.5px;background:var(--btn-off);border:1px solid var(--line);border-radius:4px;padding:8px;resize:vertical}
.dlg.wide .box{max-width:640px}
.dlg .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:700px){
  body{padding:8px}
  .edbody{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .pane.left{border-right:0;border-bottom:1px solid var(--line);max-height:30vh}
  .ovl{padding:0}.ed{border-radius:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="top">
    <h1>Search Pattern</h1>
    <button class="chip" id="voice" aria-pressed="true" title="Read each item aloud">Voice</button>
    <button class="chip" id="pop" title="Pop out into a small always-on-top window">Pop out</button>
    <button class="chip" id="minbtn" title="Show only the current item">Minimal</button>
    <button class="chip editbtn" id="edit" title="Voice and templates">Settings</button>
  </div>
  <div class="chrome wrap">
    <form class="match" id="matchform">
      <input id="match" type="text" placeholder="Paste a study name to match, e.g. CT ABDOMEN PELVIS W CONTRAST" aria-label="Study name to match" autocomplete="off">
      <button type="submit">Match</button>
    </form>
    <p class="sub" id="matchmsg">Or pick a modality and study below.</p>
    <div class="row mods" id="mods"></div>
    <div class="row cats" id="cats"></div>
    <div class="row studies" id="studies"></div>
    <hr>
    <div class="seqs" id="seqs"></div>
  </div>
  <div class="mini" id="mini" aria-live="polite">
    <div class="ms" id="ms"></div><div class="mv" id="mv"></div><div class="mi" id="mi"></div>
  </div>
  <ul class="list chrome" id="list" aria-live="polite"></ul>
  <div class="nav">
    <button class="big alt" id="prev">Back</button>
    <button class="big" id="next">Next</button>
  </div>
  <div class="nav2 chrome">
    <button class="btn" id="pseq">Previous view</button>
    <button class="btn" id="nseq">Next view</button>
  </div>
  <p class="foot"><kbd>Space</kbd> or <kbd>→</kbd> next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>↓</kbd> next view &nbsp; <kbd>↑</kbd> previous view</p>
</main>

<div class="ovl" id="ovl" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="ed">
    <header>
      <h2>Settings</h2>
      <div class="tabs" id="etabs" role="tablist"></div>
    </header>
    <div class="subnav"><div class="tabs" id="stabs" role="tablist"><button role="tab" data-v="templates">Templates</button><button role="tab" data-v="voice">Voice</button></div></div>
    <div class="pane" id="evoice" hidden>
      <div class="vs" id="vs">
        <h3 style="margin:0 0 4px;font-size:15px">Voice</h3>
        <p class="sub" style="margin:0 0 12px">Changes apply right away and are saved in this browser.</p>
        <div class="vsb">
          <label for="vsel">Voice</label>
          <select id="vsel"></select>
          <label for="vrate">Speed <span id="vrv"></span></label>
          <input type="range" id="vrate" min="0.6" max="2" step="0.1">
          <button class="sm" id="vtest" type="button">Test voice</button>
        </div>
      </div>
    </div>
    <div class="edbody" id="tplbody">
      <div class="pane left" id="eleft"></div>
      <div class="pane" id="eright"></div>
    </div>
    <footer>
      <span id="tplonly" style="display:contents">
      <button class="sm" id="dl" title="Save your templates as a file">Download</button>
      <button class="sm" id="up" title="Load templates from a file">Upload</button>
      <input type="file" id="upfile" accept=".json,application/json" hidden>
      <button class="sm" id="exp" title="Show the JSON to copy">Copy JSON</button>
      <button class="sm" id="imp" title="Paste JSON">Paste JSON</button>
      <button class="sm danger" id="reset">Reset to defaults</button>
      </span>
      <span class="sp"></span>
      <span class="msg" id="emsg"></span>
      <button class="sm" id="ecancel">Cancel</button>
      <button class="pri" id="esave">Save</button>
    </footer>
  </div>
</div>

<div class="dlg" id="dlg"><div class="box" id="dbox"></div></div>

<script>
(function(){
"use strict";
var MODS=["XR","US","FL","CT","MR"], CATS=["Neuro","Chest","Body","MSK"];
var LS="sp_templates_v1", LSUI="sp_ui_v1";
var pipWin=null;
var $=function(id){return document.getElementById(id)||(pipWin&&pipWin.document.getElementById(id))};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function ensure(d){["checklists","order","keywords","counterparts"].forEach(function(k){d[k]=d[k]||{}});return d}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

/* ---------- data ---------- */
var T;
(function(){
  var s=lsGet(LS), d=null;
  if(s){try{d=JSON.parse(s)}catch(e){d=null}}
  T=ensure(d&&d.checklists&&d.order?d:clone(window.DEFAULT_TEMPLATES));
})();
function studies(t,m,c){return ((t.order[m]||{})[c]||[]).slice()}
function items(t,m,n){return ((t.checklists[m]||{})[n]||[]).slice()}
function hasStudy(t,m,n){return !!(t.checklists[m]&&t.checklists[m][n])}
function categoryOf(t,m,n){var o=t.order[m]||{};for(var c in o){if(o[c].indexOf(n)>=0)return c}return null}
function isHdr(s){return s.indexOf("> ")===0}
function spoken(s){return isHdr(s)?s.slice(2):s}

/* ---------- state ---------- */
var ui={voice:true,minimal:false,voiceURI:"",rate:1.1};
try{var u=JSON.parse(lsGet(LSUI)||"{}");if(typeof u.voice==="boolean")ui.voice=u.voice;if(typeof u.minimal==="boolean")ui.minimal=u.minimal;if(typeof u.voiceURI==="string")ui.voiceURI=u.voiceURI;if(typeof u.rate==="number"&&u.rate>=0.6&&u.rate<=2)ui.rate=u.rate}catch(e){}
function saveUi(){lsSet(LSUI,JSON.stringify(ui))}
var S={mod:"XR",cat:"Chest",study:null,items:[],idx:-1,visited:{},finished:false};

/* ---------- speech ---------- */
function say(t){
  if(!t||!("speechSynthesis" in window))return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.rate=ui.rate;
    if(ui.voiceURI){var v=speechSynthesis.getVoices().filter(function(x){return x.voiceURI===ui.voiceURI})[0];if(v){u.voice=v;u.lang=v.lang}}
    speechSynthesis.speak(u);
  }catch(e){}
}
function speak(t){if(ui.voice)say(t)}
function fillVoices(){
  if(!("speechSynthesis" in window))return;
  var vs=speechSynthesis.getVoices().slice().sort(function(a,b){
    var ae=/^en/i.test(a.lang)?0:1,be=/^en/i.test(b.lang)?0:1;
    return ae-be||a.name.localeCompare(b.name);
  });
  var sel=$("vsel");if(!sel)return;
  sel.innerHTML='<option value="">Browser default</option>'+vs.map(function(v){
    return '<option value="'+esc(v.voiceURI)+'">'+esc(v.name+" ("+v.lang+")")+'</option>';
  }).join("");
  sel.value=ui.voiceURI;
  if(sel.value!==ui.voiceURI)sel.value="";
}
(function(){
  if(!("speechSynthesis" in window)){var el=document.getElementById("vs");if(el)el.innerHTML='<h3 style="margin:0 0 4px;font-size:15px">Voice</h3><p class="sub">This browser cannot read aloud. Try Chrome or Edge.</p>';return}
  fillVoices();
  try{speechSynthesis.addEventListener("voiceschanged",fillVoices)}catch(e){speechSynthesis.onvoiceschanged=fillVoices}
  var r=document.getElementById("vrate");r.value=ui.rate;document.getElementById("vrv").textContent=Number(ui.rate).toFixed(1)+"x";
  document.getElementById("vsel").onchange=function(){ui.voiceURI=this.value;saveUi();say("Right upper lobe")};
  r.oninput=function(){ui.rate=parseFloat(this.value);document.getElementById("vrv").textContent=ui.rate.toFixed(1)+"x";saveUi()};
  r.onchange=function(){say("Right upper lobe")};
  document.getElementById("vtest").onclick=function(){say("Right upper lobe arteries")};
})();

/* ---------- study matching ---------- */
var MODTOK={"CT":"CT","CTA":"CT","CTV":"CT","MR":"MR","MRI":"MR","MRA":"MR","MRV":"MR","MRCP":"MR","XR":"XR","DX":"XR","CR":"XR","RADIOGRAPH":"XR","RADIOGRAPHS":"XR","XRAY":"XR","US":"US","ULTRASOUND":"US","SONOGRAM":"US","DOPPLER":"US","DUPLEX":"US","FL":"FL","FLUORO":"FL","FLUOROSCOPY":"FL","FLUOROSCOPIC":"FL","VIDEOFLUOROSCOPIC":"FL","VFSS":"FL","UGI":"FL","SBFT":"FL","ESOPHAGRAM":"FL","VCUG":"FL","CYSTOURETHROGRAM":"FL","ENEMA":"FL","LOOPOGRAM":"FL","SWALLOW":"FL"};
function norm(l){return " "+l.toUpperCase().replace(/[^A-Z0-9]+/g," ").trim()+" "}
function detectMod(n){for(var t in MODTOK){if(n.indexOf(" "+t+" ")>=0)return MODTOK[t]}return null}
function bestPreset(mod,n){
  var best=null,bs=0,kw=T.keywords[mod]||{};
  for(var name in kw){
    var score=0;
    kw[name].split(",").forEach(function(p){
      p=p.trim();var i=p.lastIndexOf(":");if(!p||i<0)return;
      var term=p.slice(0,i).trim().toUpperCase(),w=parseFloat(p.slice(i+1));
      if(isNaN(w))return;
      if(n.indexOf(" "+term+" ")>=0)score+=w;
      else if(term.length>=5&&term.indexOf(" ")<0&&new RegExp(" "+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[A-Z0-9]").test(n))score+=w;
    });
    if(score>bs){bs=score;best=name}
  }
  return best;
}

/* ---------- cue panel ---------- */
function curHdr(){
  if(!S.items.length)return null;
  var i=Math.min(Math.max(S.idx,0),S.items.length-1);
  for(;i>=0;i--){if(isHdr(S.items[i]))return i}
  return null;
}
function headers(){var h=[];S.items.forEach(function(s,i){if(isHdr(s))h.push(i)});return h}
function blockReviewed(h){
  var j=h+1,any=false;
  while(j<S.items.length&&!isHdr(S.items[j])){any=true;if(!S.visited[j])return false;j++}
  return any;
}
function renderMods(){
  $("mods").innerHTML=MODS.map(function(m){return '<button class="btn'+(m===S.mod?' sel':'')+'" data-m="'+m+'">'+m+'</button>'}).join("");
}
function renderCats(){
  $("cats").innerHTML=CATS.map(function(c){
    var has=studies(T,S.mod,c).length>0;
    return '<button class="btn'+(c===S.cat?' sel':(has?'':' off'))+'" data-c="'+c+'">'+c+'</button>';
  }).join("");
}
function renderStudies(){
  var names=studies(T,S.mod,S.cat);
  $("studies").innerHTML=names.length?names.map(function(n){
    return '<button class="btn'+(n===S.study?' study-sel':'')+'" data-s="'+esc(n)+'">'+esc(n)+'</button>';
  }).join(""):'<p class="sub" style="grid-column:1/-1">No studies in this category.</p>';
}
function renderSeq(){
  var ch=curHdr();
  $("seqs").innerHTML=headers().map(function(i){
    var cls=i===ch?" sel":(blockReviewed(i)?" reviewed":"");
    return '<button class="btn'+cls+'" data-i="'+i+'">'+esc(S.items[i].slice(2))+'</button>';
  }).join("");
}
function renderList(){
  var L=$("list");
  if(!S.items.length){L.innerHTML='<li class="empty">Select a study</li>';return}
  var h=curHdr(),start=h===null?0:h+1,end=S.items.length;
  for(var i=start;i<S.items.length;i++){if(isHdr(S.items[i])){end=i;break}}
  var out="";
  for(i=start;i<end;i++){
    var cls=i<S.idx?"done":(i===S.idx?"cur":""),mk=i<S.idx?"✓":(i===S.idx?"▶":"");
    out+='<li class="'+cls+'" data-i="'+i+'"><span class="mk">'+mk+'</span><span>'+esc(S.items[i])+'</span></li>';
  }
  if(S.finished)out+='<li class="finish"><span class="mk">✓</span><span>Checklist complete</span></li>';
  L.innerHTML=out;
  var c=L.querySelector(".cur");
  if(c){L.scrollTop=Math.max(0,c.offsetTop-L.offsetTop-L.clientHeight/3)}
}
function renderMini(){
  if(!S.items.length){$("ms").textContent="";$("mv").textContent="";$("mi").textContent="Select a study";return}
  $("ms").textContent=S.mod+" • "+S.study;
  var h=curHdr();$("mv").textContent=h===null?"":S.items[h].slice(2);
  $("mi").textContent=S.finished?"Checklist complete":(S.idx>=0&&S.idx<S.items.length?spoken(S.items[S.idx]):"Press Next to start");
}
function renderAll(){
  renderMods();renderCats();renderStudies();renderSeq();renderList();renderMini();
  $("app").classList.toggle("min",ui.minimal);
  $("minbtn").textContent=ui.minimal?"Full":"Minimal";
  $("voice").setAttribute("aria-pressed",ui.voice?"true":"false");
  $("voice").textContent=ui.voice?"Voice on":"Voice off";
  $("pop").textContent=pipWin?"Dock":"Pop out";
}
function loadStudy(mod,name,quiet){
  S.mod=mod;S.study=name;S.items=items(T,mod,name);S.visited={};S.finished=false;
  S.cat=categoryOf(T,mod,name)||S.cat;
  var h=headers();
  if(S.items.length&&!quiet){S.idx=h.length?h[0]:0;S.visited[S.idx]=true;speak(spoken(S.items[S.idx]))}
  else S.idx=-1;
  renderAll();
}
function go(i){S.finished=false;S.idx=i;S.visited[i]=true;renderAll();speak(spoken(S.items[i]))}
function next(){
  if(!S.items.length){$("match").focus();return}
  if(S.idx>=S.items.length-1){
    if(!S.finished){S.finished=true;renderAll();speak("Checklist complete")}
    else{S.finished=false;renderAll();$("match").focus();$("match").select()}
    return;
  }
  go(S.idx+1);
}
function prev(){
  if(!S.items.length)return;
  if(S.finished){S.finished=false;S.visited[S.idx]=true;renderAll();speak(spoken(S.items[S.idx]));return}
  if(S.idx>0)go(S.idx-1);else go(0);
}
function nextSeq(){
  if(!S.items.length)return;
  var n=headers().filter(function(h){return h>S.idx});
  go(n.length?n[0]:S.items.length-1);
}
function prevSeq(){
  if(!S.items.length)return;
  var cur=curHdr(),p=headers().filter(function(h){return h<(cur===null?S.idx:cur)});
  go(p.length?p[p.length-1]:0);
}
function setMod(m){
  if(m===S.mod)return;
  var old=S.study;S.mod=m;
  if(old){
    var t=old;
    if(!hasStudy(T,m,t)){var cp=T.counterparts[t];if(cp&&hasStudy(T,m,cp))t=cp}
    if(hasStudy(T,m,t)){loadStudy(m,t);return}
  }
  renderAll();
}
function runMatch(){
  var line=$("match").value.trim();
  if(!line){$("matchmsg").textContent="Paste a study name first.";return}
  var n=norm(line),mod=detectMod(n)||S.mod,name=bestPreset(mod,n);
  if(!name){$("matchmsg").textContent="No matching study. Pick one below.";speak("No matching study");return}
  $("matchmsg").textContent="Matched "+mod+" • "+name;
  loadStudy(mod,name);
}
$("mods").onclick=function(e){var b=e.target.closest("[data-m]");if(b)setMod(b.dataset.m)};
$("cats").onclick=function(e){var b=e.target.closest("[data-c]");if(b){S.cat=b.dataset.c;renderCats();renderStudies()}};
$("studies").onclick=function(e){var b=e.target.closest("[data-s]");if(b)loadStudy(S.mod,b.dataset.s)};
$("seqs").onclick=function(e){var b=e.target.closest("[data-i]");if(b)go(+b.dataset.i)};
$("list").onclick=function(e){var li=e.target.closest("li[data-i]");if(li)go(+li.dataset.i)};
$("next").onclick=next;$("prev").onclick=prev;$("nseq").onclick=nextSeq;$("pseq").onclick=prevSeq;
$("matchform").onsubmit=function(e){e.preventDefault();runMatch()};
$("voice").onclick=function(){ui.voice=!ui.voice;if(!ui.voice&&"speechSynthesis" in window)speechSynthesis.cancel();saveUi();renderAll()};
$("minbtn").onclick=function(){ui.minimal=!ui.minimal;saveUi();renderAll()};
function onKey(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if($("ovl").classList.contains("open")||$("dlg").classList.contains("open"))return;
  var t=e.target,tag=t&&t.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  if(e.key==="Escape")return;
  var k=e.key,f=true;
  if(k===" "||k==="ArrowRight"){if(tag==="BUTTON"&&k===" ")return;next()}
  else if(k==="ArrowLeft")prev();
  else if(k==="ArrowDown"||k==="]")nextSeq();
  else if(k==="ArrowUp"||k==="[")prevSeq();
  else f=false;
  if(f)e.preventDefault();
}
document.addEventListener("keydown",onKey);

/* ---------- small dialogs ---------- */
var dlgDone=null;
function dlgOpen(html,wide){
  $("dbox").innerHTML=html;$("dlg").classList.toggle("wide",!!wide);$("dlg").classList.add("open");
  var f=$("dbox").querySelector("input,textarea");if(f){f.focus();if(f.select)f.select()}
}
function dlgClose(v){$("dlg").classList.remove("open");var d=dlgDone;dlgDone=null;if(d)d(v)}
function askText(title,label,val){
  return new Promise(function(res){
    dlgDone=res;
    dlgOpen('<h4>'+esc(title)+'</h4><p>'+esc(label)+'</p><input class="field" id="dlgin" value="'+esc(val||"")+'"><div class="acts"><button class="sm" data-x="0">Cancel</button><button class="pri" data-x="1">OK</button></div>');
    $("dlgin").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();var v=$("dlgin").value.trim();dlgClose(v||null)}else if(e.key==="Escape")dlgClose(null)};
    $("dbox").onclick=function(e){var b=e.target.closest("[data-x]");if(!b)return;dlgClose(b.dataset.x==="1"?($("dlgin").value.trim()||null):null)};
  });
}
function askYes(title,msg,yes){
  return new Promise(function(res){
    dlgDone=res;
    dlgOpen('<h4>'+esc(title)+'</h4><p>'+esc(msg)+'</p><div class="acts"><button class="sm" data-x="0">Cancel</button><button class="pri" data-x="1">'+esc(yes||"OK")+'</button></div>');
    $("dbox").onclick=function(e){var b=e.target.closest("[data-x]");if(b)dlgClose(b.dataset.x==="1")};
  });
}
function showText(title,msg,text,editable){
  return new Promise(function(res){
    dlgDone=res;
    dlgOpen('<h4>'+esc(title)+'</h4><p>'+esc(msg)+'</p><textarea id="dlgta"'+(editable?'':' readonly')+' spellcheck="false">'+esc(text)+'</textarea><div class="acts">'+(editable?'<label class="sm" style="cursor:pointer">Load file<input type="file" id="dlgfile" accept=".json,application/json" hidden></label>':'<button class="sm" data-x="copy">Copy</button>')+'<button class="sm" data-x="0">'+(editable?'Cancel':'Close')+'</button>'+(editable?'<button class="pri" data-x="1">Import</button>':'')+'</div>',true);
    if(!editable){$("dlgta").select()}
    if(editable){$("dlgfile").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$("dlgta").value=String(r.result)};r.readAsText(f)}}
    $("dbox").onclick=function(e){
      var b=e.target.closest("[data-x]");if(!b)return;
      if(b.dataset.x==="copy"){try{navigator.clipboard.writeText($("dlgta").value).then(function(){b.textContent="Copied"},function(){b.textContent="Select and copy manually"})}catch(x){b.textContent="Select and copy manually"}return}
      dlgClose(b.dataset.x==="1"?$("dlgta").value:null);
    };
  });
}

/* ---------- editor ---------- */
var ED=null;
function edOpen(){
  ED={draft:clone(T),mod:S.mod,name:S.study&&hasStudy(T,S.mod,S.study)?S.study:null,focus:-1,dirty:false};
  if(!ED.name){var f=firstStudy(ED.draft,ED.mod);ED.name=f}
  $("emsg").textContent="";
  $("ovl").classList.add("open");setView("templates");edRender();
}
function firstStudy(t,m){for(var i=0;i<CATS.length;i++){var s=studies(t,m,CATS[i]);if(s.length)return s[0]}return null}
function setView(v){
  var vo=v==="voice";
  $("evoice").hidden=!vo;$("tplbody").hidden=vo;$("etabs").hidden=vo;$("tplonly").hidden=vo;
  [].forEach.call($("stabs").querySelectorAll("button"),function(b){b.setAttribute("aria-selected",String(b.dataset.v===v))});
}
$("stabs").onclick=function(e){var b=e.target.closest("[data-v]");if(b)setView(b.dataset.v)};
function edDirty(){return !!ED&&JSON.stringify(ED.draft)!==JSON.stringify(T)}
async function tryClose(){
  if(edDirty()){
    var y=await askYes("Discard changes?","You have template edits that are not saved. Close without saving them?","Discard");
    if(!y){setView("templates");return}
  }
  edClose();
}
function edClose(){$("ovl").classList.remove("open");ED=null}
function edRender(){
  $("etabs").innerHTML=MODS.map(function(m){return '<button role="tab" data-m="'+m+'" aria-selected="'+(m===ED.mod)+'">'+m+'</button>'}).join("");
  var L='<div class="tools"><button data-a="new">New</button><button data-a="dup">Duplicate</button><button data-a="ren">Rename</button><button data-a="up" title="Move up">↑</button><button data-a="down" title="Move down">↓</button><button class="danger" style="color:var(--danger)" data-a="del">Delete</button></div>';
  CATS.forEach(function(c){
    var ss=studies(ED.draft,ED.mod,c);
    L+='<div class="cat-h">'+c+'</div>';
    if(!ss.length)L+='<div class="sub" style="padding:2px 8px">Empty</div>';
    ss.forEach(function(n){L+='<button class="st" data-n="'+esc(n)+'" aria-current="'+(n===ED.name)+'">'+esc(n)+'</button>'});
  });
  $("eleft").innerHTML=L;
  var R="";
  if(!ED.name||!hasStudy(ED.draft,ED.mod,ED.name)){R='<p class="sub">Select a study on the left, or create one with New.</p>'}
  else{
    var cat=categoryOf(ED.draft,ED.mod,ED.name),rows=ED.draft.checklists[ED.mod][ED.name];
    R+='<div class="meta"><h3>'+esc(ED.mod+" • "+ED.name)+'</h3><label class="sub" for="ecat">Category</label><select id="ecat">'+CATS.map(function(c){return '<option'+(c===cat?' selected':'')+'>'+c+'</option>'}).join("")+'</select></div>';
    R+='<div class="tools"><button data-a="addi">+ Structure</button><button data-a="addh">+ View header</button></div>';
    R+='<div class="rows" id="erows">'+rows.map(function(t,i){
      var h=isHdr(t);
      return '<div class="er'+(h?' hdr':'')+'" data-i="'+i+'"><span class="h" draggable="true" title="Drag to reorder">⋮⋮</span><input value="'+esc(h?t.slice(2):t)+'" data-i="'+i+'" aria-label="Row '+(i+1)+'"><button class="sm" data-r="h" title="Toggle view header">'+(h?'Header':'Item')+'</button><button class="sm" data-r="u" title="Move up">↑</button><button class="sm" data-r="d" title="Move down">↓</button><button class="sm danger" data-r="x" title="Delete row">✕</button></div>';
    }).join("")+'</div>';
    R+='<div class="kw"><label for="ekw">Auto-detect keywords (TERM:weight, comma separated; negative weights penalize)</label><input id="ekw" value="'+esc((ED.draft.keywords[ED.mod]||{})[ED.name]||"")+'" placeholder="BRAIN:2, HEAD:2"></div>';
  }
  $("eright").innerHTML=R;
}
function curRows(){return ED.draft.checklists[ED.mod][ED.name]}
function edMsg(t){$("emsg").textContent=t}
$("edit").onclick=edOpen;
$("ecancel").onclick=function(){edClose()};
$("esave").onclick=function(){
  T=ensure(ED.draft);
  var ok=lsSet(LS,JSON.stringify(T));
  if(S.study&&hasStudy(T,S.mod,S.study)){S.items=items(T,S.mod,S.study);S.idx=Math.min(S.idx,S.items.length-1);S.cat=categoryOf(T,S.mod,S.study)||S.cat}
  else if(S.study){S.study=null;S.items=[];S.idx=-1}
  edClose();renderAll();
  $("matchmsg").textContent=ok?"Templates saved in this browser.":"Saved for this session only. Use Export to keep a copy.";
};
$("etabs").onclick=function(e){var b=e.target.closest("[data-m]");if(!b)return;ED.mod=b.dataset.m;ED.name=firstStudy(ED.draft,ED.mod);ED.focus=-1;edRender()};
$("eleft").onclick=async function(e){
  var st=e.target.closest("[data-n]");
  if(st){ED.name=st.dataset.n;ED.focus=-1;edRender();return}
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,d=ED.draft,m=ED.mod,n=ED.name,cat=n?categoryOf(d,m,n):null;
  if(a==="new"){
    var nm=await askText("New study","Name for the new "+m+" study (button label):","");
    if(!nm)return;if(hasStudy(d,m,nm)){edMsg(m+" already has "+nm);return}
    var c=cat||"Body";
    d.checklists[m]=d.checklists[m]||{};d.checklists[m][nm]=["> View 1","New structure"];
    d.order[m]=d.order[m]||{};d.order[m][c]=d.order[m][c]||[];d.order[m][c].push(nm);ED.name=nm;ED.focus=-1;edRender();
  }else if(!n){return}
  else if(a==="dup"){
    var nn=await askText("Duplicate study","Name for the copy:",n+" copy");
    if(!nn)return;if(hasStudy(d,m,nn)){edMsg(m+" already has "+nn);return}
    d.checklists[m][nn]=d.checklists[m][n].slice();
    var arr=d.order[m][cat];arr.splice(arr.indexOf(n)+1,0,nn);
    var kw=(d.keywords[m]||{})[n];if(kw){d.keywords[m][nn]=kw}
    ED.name=nn;edRender();
  }else if(a==="ren"){
    var rn=await askText("Rename study","New name:",n);
    if(!rn||rn===n)return;if(hasStudy(d,m,rn)){edMsg(m+" already has "+rn);return}
    d.checklists[m][rn]=d.checklists[m][n];delete d.checklists[m][n];
    var o=d.order[m][cat];o[o.indexOf(n)]=rn;
    if(d.keywords[m]&&d.keywords[m][n]!==undefined){d.keywords[m][rn]=d.keywords[m][n];delete d.keywords[m][n]}
    ED.name=rn;edRender();
  }else if(a==="del"){
    var yes=await askYes("Delete study","Delete "+m+" • "+n+"? You can still Cancel the editor to undo this before saving.","Delete");
    if(!yes)return;
    delete d.checklists[m][n];var o2=d.order[m][cat];o2.splice(o2.indexOf(n),1);
    if(d.keywords[m])delete d.keywords[m][n];
    ED.name=firstStudy(d,m);edRender();
  }else if(a==="up"||a==="down"){
    var ar=d.order[m][cat],i=ar.indexOf(n),j=a==="up"?i-1:i+1;
    if(j>=0&&j<ar.length){ar.splice(i,1);ar.splice(j,0,n);edRender()}
  }
};
$("eright").onclick=function(e){
  var d=ED.draft,m=ED.mod,n=ED.name;if(!n)return;
  var rows=curRows(),a=e.target.closest("[data-a]");
  if(a){
    var at=ED.focus>=0&&ED.focus<rows.length?ED.focus+1:rows.length;
    rows.splice(at,0,a.dataset.a==="addh"?"> New view":"New structure");
    ED.focus=at;edRender();
    var inp=$("erows").querySelector('input[data-i="'+at+'"]');if(inp){inp.focus();inp.select()}
    return;
  }
  var r=e.target.closest("[data-r]");if(!r)return;
  var i=+r.closest(".er").dataset.i,k=r.dataset.r;
  if(k==="x"){rows.splice(i,1);ED.focus=-1}
  else if(k==="u"&&i>0){var t=rows.splice(i,1)[0];rows.splice(i-1,0,t);ED.focus=i-1}
  else if(k==="d"&&i<rows.length-1){var t2=rows.splice(i,1)[0];rows.splice(i+1,0,t2);ED.focus=i+1}
  else if(k==="h"){rows[i]=isHdr(rows[i])?rows[i].slice(2):"> "+rows[i]}
  edRender();
};
$("eright").addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="ekw"){ED.draft.keywords[ED.mod]=ED.draft.keywords[ED.mod]||{};ED.draft.keywords[ED.mod][ED.name]=t.value.trim();return}
  if(t.dataset&&t.dataset.i!==undefined&&t.closest(".er")){var i=+t.dataset.i,rows=curRows();rows[i]=(isHdr(rows[i])?"> ":"")+t.value}
});
$("eright").addEventListener("focusin",function(e){var t=e.target;if(t.dataset&&t.dataset.i!==undefined&&t.closest(".er"))ED.focus=+t.dataset.i});
$("eright").addEventListener("change",function(e){
  if(e.target.id!=="ecat")return;
  var d=ED.draft,m=ED.mod,n=ED.name,from=categoryOf(d,m,n),to=e.target.value;
  if(from===to)return;
  var a=d.order[m][from];a.splice(a.indexOf(n),1);d.order[m][to]=d.order[m][to]||[];d.order[m][to].push(n);edRender();
});
/* drag to reorder rows */
var dragI=null;
$("eright").addEventListener("dragstart",function(e){
  var h=e.target.closest&&e.target.closest(".h");if(!h)return;
  var row=h.closest(".er");dragI=+row.dataset.i;
  try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","row");e.dataTransfer.setDragImage(row,10,10)}catch(x){}
});
$("eright").addEventListener("dragover",function(e){
  if(dragI===null)return;var row=e.target.closest(".er");if(!row)return;e.preventDefault();
  [].forEach.call(document.querySelectorAll(".er.drop"),function(x){x.classList.remove("drop")});row.classList.add("drop");
});
$("eright").addEventListener("drop",function(e){
  if(dragI===null)return;var row=e.target.closest(".er");if(!row)return;e.preventDefault();
  var to=+row.dataset.i,rows=curRows(),t=rows.splice(dragI,1)[0];rows.splice(to,0,t);dragI=null;ED.focus=to;edRender();
});
$("eright").addEventListener("dragend",function(){dragI=null;[].forEach.call(document.querySelectorAll(".er.drop"),function(x){x.classList.remove("drop")})});

$("exp").onclick=function(){showText("Export templates","Copy this JSON to keep a backup, or to share your templates with someone else.",JSON.stringify(ED.draft,null,1),false)};
function applyImport(txt){
  try{
    var d=JSON.parse(txt);
    if(!d||typeof d!=="object"||!d.checklists||!d.order)throw new Error("needs checklists and order");
    ED.draft=ensure(d);ED.mod=MODS[0];ED.name=firstStudy(ED.draft,ED.mod);ED.focus=-1;edRender();edMsg("Imported. Press Save to keep it.");
  }catch(x){edMsg("Import failed: "+x.message)}
}
$("imp").onclick=async function(){
  var txt=await showText("Paste templates","Paste a templates.json. This replaces the templates in the editor; nothing is kept until you press Save.","",true);
  if(txt===null||!String(txt).trim())return;
  applyImport(txt);
};
$("dl").onclick=function(){
  try{
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(ED.draft,null,1)],{type:"application/json"}));
    a.download="searchpattern-templates.json";
    document.body.appendChild(a);a.click();a.remove();
    edMsg("Download started. If no file appeared, use Copy JSON instead.");
  }catch(x){edMsg("Download is blocked here. Use Copy JSON instead.")}
};
$("up").onclick=function(){$("upfile").value="";$("upfile").click()};
$("upfile").onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){applyImport(String(r.result))};
  r.onerror=function(){edMsg("Could not read that file.")};
  r.readAsText(f);
};
$("reset").onclick=async function(){
  var y=await askYes("Reset to defaults","Replace all templates in the editor with the original set? Press Save afterward to keep it.","Reset");
  if(!y)return;
  ED.draft=ensure(clone(window.DEFAULT_TEMPLATES));ED.name=firstStudy(ED.draft,ED.mod);ED.focus=-1;edRender();edMsg("Defaults restored. Press Save to keep them.");
};
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if($("dlg").classList.contains("open"))dlgClose(null);
    else if($("ovl").classList.contains("open"))tryClose();
  }
});

function note(t){$("matchmsg").textContent=t}

/* ---------- pop-out window ---------- */
var preMin=false;
function popToggle(){
  if(pipWin){pipWin.close();return}
  if(!("documentPictureInPicture" in window)){note("Pop-out needs Chrome or Edge 116 or newer.");return}
  window.documentPictureInPicture.requestWindow({width:380,height:520}).then(function(w){
    var app=document.getElementById("app"),d=w.document;
    [].forEach.call(document.querySelectorAll("link[rel=stylesheet],style"),function(n){d.head.appendChild(n.cloneNode(true))});
    var th=document.documentElement.getAttribute("data-theme");if(th)d.documentElement.setAttribute("data-theme",th);
    d.body.style.cssText="margin:0;padding:0";
    pipWin=w;app.classList.add("pip");d.body.appendChild(app);
    preMin=ui.minimal;ui.minimal=true;
    d.addEventListener("keydown",onKey);
    w.addEventListener("pagehide",function(){
      pipWin=null;app.classList.remove("pip");
      document.body.insertBefore(app,document.getElementById("ovl"));
      ui.minimal=preMin;renderAll();
    });
    renderAll();
  }).catch(function(){note("The browser did not allow a pop-out window here. Click Pop out again.")});
}
$("pop").onclick=popToggle;

/* ---------- start ---------- */
(function(){
  var first=studies(T,"XR","Chest")[0]||firstStudy(T,"XR");
  if(first)loadStudy("XR",first,true);else renderAll();
})();
})();
</script>
